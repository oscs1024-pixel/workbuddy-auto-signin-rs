[package]
name = "workbuddy-auto-signin"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of workbuddy-auto-signin with behavior-compatible WorkBuddy check-in and growth-center automation"
license = "MIT"
repository = "https://github.com/oscs1024-pixel/workbuddy-auto-signin-rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
