name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve lockfile for audit
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo generate-lockfile
          echo '---BEGIN-CARGO-LOCK---'
          cat Cargo.lock
          echo '---END-CARGO-LOCK---'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets

  build-release:
    name: build release (${{ matrix.target }})
    if: github.event_name == 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="workbuddy-auto-signin-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "dist/$archive" workbuddy-auto-signin
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "workbuddy-auto-signin-${{ matrix.target }}.zip"
          Compress-Archive -Path "target\${{ matrix.target }}\release\workbuddy-auto-signin.exe" -DestinationPath "dist\$archive" -Force
          $hash = (Get-FileHash "dist\$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "dist\$archive.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: publish GitHub Release
    if: github.event_name == 'push'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --generate-notes --title "$tag"
          fi

      - name: Publish rolling latest release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="latest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force

          notes="Automated build from main at commit \`$GITHUB_SHA\`."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Latest build" --prerelease --notes "$notes"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Latest build" --prerelease --notes "$notes"
          fi
